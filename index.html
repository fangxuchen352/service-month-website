<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GC学生会活动安排</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
</head>

<body>
    <header class="page-header">
        <div>
            <h1 class="header-title">GCinfo</h1>
            <p class="header-subtitle" data-i18n="subtitle">汇聚各学生组织最新鲜的活动资讯与指南</p>
        </div>
        <div class="header-actions">
            <div class="header-controls">
                <button
                    class="language-toggle"
                    type="button"
                    data-language-toggle
                    data-i18n="languageAction"
                    data-i18n-aria-label="languageActionLabel"
                >English</button>
                <a class="management-link" href="admin.html" data-i18n="management">内容管理</a>
            </div>
            <div class="header-logo-text" data-i18n="producedBy">✨ GC学生会出品</div>
        </div>
    </header>

    <main class="main-container">
        <section class="calendar-section" aria-label="活动日历" data-i18n-aria-label="calendarLabel">
            <div id="calendar"></div>
        </section>

        <section class="resources-section" aria-label="学生资源" data-i18n-aria-label="resourcesLabel">
            <div id="resource-grid" class="icon-grid" aria-live="polite">
                <p class="loading-message" data-i18n="loading">正在加载内容…</p>
            </div>

            <div class="legend-container">
                <h2 class="legend-title" data-i18n="legendTitle">🎨 活动图例</h2>
                <div id="legend-items"></div>
            </div>
        </section>
    </main>

    <div id="custom-tooltip" class="event-tooltip" role="dialog" aria-live="polite">
        <button
            class="tooltip-close"
            type="button"
            data-tooltip-close
            aria-label="关闭活动详情"
            data-i18n-aria-label="closeDetails"
        >×</button>
        <h3 id="tooltip-title">活动标题</h3>
        <div class="tooltip-time" id="tooltip-time">时间信息</div>
        <div class="tooltip-location" id="tooltip-location"></div>
        <div class="tooltip-desc" id="tooltip-desc">描述内容</div>
        <a id="tooltip-link" class="tooltip-link" target="_blank" rel="noopener noreferrer" hidden></a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/content-data.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/data-service.js"></script>
    <script src="js/resources.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
